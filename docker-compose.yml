services:
  postgres:
    image: postgres:16
    container_name: downtime-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-downtime_app}
      POSTGRES_USER: ${POSTGRES_USER:-noman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - downtime_postgres_data:/var/lib/postgresql/data

volumes:
  downtime_postgres_data:
