spring:
  application:
    name: downtime

  datasource:
    url: jdbc:postgresql://localhost:5432/downtime_app
    username: noman
    password: Getsuga

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    bootstrap:
      enabled: ${BOOTSTRAP_USERS_ENABLED:true}
      admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
      technician-password: ${BOOTSTRAP_TECHNICIAN_PASSWORD:Tech123!}
